name: "Test dev container features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - bpftool
          - cni-plugins
          - docsify
          - gcx
          - go-ebpf
          - go-mod-upgrade
          - gocover
          - goreportcard
          - grafanactl
          - lazygit
          - local-pkgsite
          - nerdctl
          - pin-github-action
          - pull-through-cache-registry
          # - wal-wahl
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli@0.84.1

      - name: "generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-autogenerated --skip-duplicated -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .
